apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cockpit-runner
  namespace: argocd            # namespace d'Argo CD sur votre cluster : à vérifier
spec:
  project: default
  source:
    repoURL: https://github.com/th-e-o/cockpit.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: user-theof
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
