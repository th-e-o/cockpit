# Exemple, NON appliqué par Argo CD (absent de kustomization.yaml). Ne jamais committer de vraies valeurs.
# Création directe, sans fichier :
#   kubectl -n user-theof create secret generic cockpit-secrets \
#     --from-literal=claude-token="$CLAUDE_CODE_OAUTH_TOKEN" \
#     --from-literal=worker-key="$(cat data/worker_key)" \
#     --from-literal=git-token="..."        # optionnel : dépôt privé / push
apiVersion: v1
kind: Secret
metadata: { name: cockpit-secrets }
type: Opaque
stringData:
  claude-token: "<CLAUDE_CODE_OAUTH_TOKEN>"
  worker-key: "<contenu de data/worker_key>"
  git-token: "<optionnel>"
