name: Image du runner

on:
  push:
    branches: [main]
    paths: ['cockpit/**', 'config/**', 'requirements.txt', 'run.sh', 'deploy/Dockerfile', 'deploy/entrypoint.sh',
            '.dockerignore', '.github/workflows/image.yml']
  workflow_dispatch:

concurrency: image-runner

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit du nouveau tag dans deploy/k8s/kustomization.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: COCKPIT_VERSION=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cockpit-runner:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cockpit-runner:${{ github.sha }}

      # Argo CD déploie ce que dit git : le nouveau tag y est écrit, ce qui redéploie le runner.
      # Un push fait avec GITHUB_TOKEN ne relance pas de workflow (pas de boucle).
      - name: Référencer la nouvelle image dans deploy/k8s
        run: |
          sed -i "s|^    newTag: .*|    newTag: ${GITHUB_SHA}|" deploy/k8s/kustomization.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Runner : image ${GITHUB_SHA::8}"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
