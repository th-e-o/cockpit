name: Image du runner

on:
  push:
    branches: [main]
    paths: ['deploy/Dockerfile', 'deploy/entrypoint.sh', '.github/workflows/image.yml']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cockpit-runner:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cockpit-runner:${{ github.sha }}
