name: Déploiement VPS (cockpit.deltastat.fr)

on:
  push:
    branches: [main]
    paths: ['web/**', 'config/worker_key.sha256', 'config/api_keys.sha256', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:

concurrency: deploiement-cockpit

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe PHP
        run: for f in web/*.php scripts/*.php; do php -l "$f"; done

      - name: Générer web/config.php
        env:
          COCKPIT_HOTE: ${{ vars.COCKPIT_HOTE }}
          COCKPIT_BASE: ${{ vars.COCKPIT_BASE }}
        run: php scripts/generer-config.php

      - name: Versionner CSS et JS (contourne le cache des navigateurs)
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/g" web/index.html web/sw.js

      - name: Envoyer sur le VPS (rsync)
        # La clé DEPLOY_SSH_KEY ne peut que lancer rsync dans /srv/cockpit/web (rrsync côté serveur) :
        # elle ne peut ni toucher aux autres apps ni exécuter de commande. data/ n'est jamais envoyé ni écrasé.
        env:
          CLE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOTES_CONNUS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOTE: ${{ vars.DEPLOY_HOST || '217.182.169.200' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement && chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$HOTES_CONNUS" > ~/.ssh/known_hosts
          rsync -rlptz --delete --chmod=D750,F640 --exclude='/data/' --exclude='.git*' \
            -e 'ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            web/ "cockpit@$HOTE:/"
