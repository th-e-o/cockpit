# Registre des projets pilotables.
# cwd : dossier de travail de l'agent (doit exister dans ce pod).
# description / keywords : utilisés par le routeur automatique.
projects:
  - id: cockpit
    name: Cockpit
    cwd: /home/onyxia/work/cockpit
    description: Le cockpit lui-même (API FastAPI, PWA mobile, politique de sécurité des agents).
    keywords: [cockpit, pwa, politique, policy, validation]

  - id: onyxia
    name: Environnement Onyxia
    cwd: /home/onyxia/work
    description: >
      Administration du namespace Kubernetes user-theof sur SSP Cloud : services Onyxia
      (vscode, mlflow, bases de données), releases helm, pods, stockage S3 MinIO.
      C'est aussi ici qu'on crée un NOUVEAU projet : lancer, lister ou arrêter un service
      (pod VSCode dédié, avec ou sans dépôt git), quel que soit le sujet du futur projet.
    keywords: [onyxia, kubectl, helm, pod, service, services, namespace, mlflow, s3, minio, cluster, projet, nouveau, créer, lancer, vscode]
