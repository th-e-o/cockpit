# Politique de sécurité des agents.
# Ordre d'évaluation : deny > ask > allow > défaut (ask).
# Les motifs sont des regex Python (re.search, insensible à la casse).

default: ask
approval_timeout_s: 900   # sans réponse => refus

# Outils toujours autorisés (lecture seule / sans effet de bord)
# ToolSearch ne fait que charger la définition d'un outil : son usage reste soumis à la politique.
# proposer_suite : simple proposition affichée sur le téléphone (aucun effet)
# capturer_ecran : pages du pod seulement (localhost) ; ouvrir_pr : jamais depuis main/master, réversible
# confier_au_projet : transmet la demande de l'utilisateur à un projet du cockpit (sa politique s'y applique)
allow_tools: [Read, Glob, Grep, TodoWrite, Task, Agent, WebSearch, ToolSearch, mcp__services__lister_services, mcp__cockpit__proposer_suite,
              mcp__cockpit__capturer_ecran, mcp__cockpit__ouvrir_pr, mcp__cockpit__chercher_depots,
              mcp__cockpit__confier_au_projet, mcp__cockpit__poser_question,
              mcp__cockpit__etat_projet]

# Outils jamais autorisés : questions bloquantes (poser_question les remplace), et outils de Claude Code qui
# atteignent d'autres sessions Claude de la machine ou planifient du travail hors du cockpit.
deny_tools: [AskUserQuestion, ListAgents, SendMessage, RemoteTrigger, CronCreate, CronDelete, ScheduleWakeup, PushNotification]

# Outils toujours soumis à validation
# Lancement et arrêt de services : toujours validés (la carte affiche dépôt, ressources et quota)
# Agents en parallèle (lancer_en_parallele) : validés, la carte liste les sous-tâches
# Création d'un dépôt GitHub (creer_depot) : validée, la carte indique le nom et la visibilité
ask_tools: [WebFetch, NotebookEdit, mcp__services__lancer_service, mcp__services__arreter_service, mcp__cockpit__lancer_en_parallele, mcp__cockpit__creer_depot]

# Écriture de fichiers (Write, Edit, MultiEdit)
files:
  # dans le dossier du projet => auto, sauf ces chemins
  ask_paths: ['/\.git/', '\.github/workflows/', '(^|/)\.env', 'Dockerfile$', '(^|/)values.*\.ya?ml$', '/policy\.(ya?ml|py)$']
  deny_paths: ['/\.claude/', '/\.ssh/', '/\.kube/', '/\.aws/', '/etc/']
  # hors du dossier du projet => ask

bash:
  # Si un segment correspond => refus immédiat
  deny:
    - 'kubectl\s+delete\s+(ns|namespace)\b'
    # rm de la racine, du dossier personnel, de ~/work (tous les projets) ou de tout leur contenu, quelles que soient les
    # options et les guillemets
    - '\brm\s+(-\S+\s+)*["'']?(/|~|\$HOME|\$\{HOME\}|/home/[\w.-]+)(/work)?["'']?/?\*?(\s|$)'
    - '\bfind\s+["'']?(/|~|\$HOME|\$\{HOME\})["'']?/?\s.*-delete\b'
    - 'git\s+push\b.*(--force|\s-\w*f\b|\s\+).*\b(main|master)\b|git\s+push\b.*\b(main|master)\b.*(--force|\s-\w*f\b)'
    - '\bvault\s+(kv\s+)?(put|delete|write|destroy)'
    - '\b(cat|less|head|tail)\b.*(\.ssh|\.kube/config|credentials|\.env\b)'
    - 'printenv|^env$|\benv\s*\|'
    - 'mkfs|dd\s+if=|:\(\)\s*\{'
    - '\bcurl\b.*\|\s*(ba|z)?sh'
  # Si un segment correspond => validation humaine
  ask:
    - '\bgit\s+(reset\s+--hard|clean|rebase|branch\s+-D)'
    # git push : validation, sauf la forme sûre autorisée plus bas (branche de travail nommée explicitement)
    - '^(?!git\s+push(\s+(-u|--set-upstream))?\s+origin\s+(?!(refs/heads/)?(main|master|HEAD)\s*$)[\w.][\w./-]*\s*$).*\bgit\s+push\b'
    - '\bhelm\s+(install|upgrade|uninstall|delete|rollback)'
    - '\bkubectl\s+(apply|create|delete|patch|scale|edit|replace|exec|rollout|drain|cordon)'
    - '\b(pip|uv\s+pip|npm|apt(-get)?|conda|mamba)\s+(install|uninstall|remove)'
    - '\buv\s+(add|remove)'
    - '\b(mc|aws\s+s3|s3cmd|rclone)\b.*\b(rm|cp|mv|sync|put|del|rb)\b'
    - '\b(aws\s+s3api|mc\s+(mirror|admin))\b'
    - '\brm\s'
    - '\bfind\b.*\s-(delete|exec|execdir|ok)\b'
    - '\bxargs\b'
    - '\b(sudo|chmod|chown|kill|pkill)\b'
    - '\b(curl|wget)\b.*(-X\s*(POST|PUT|DELETE|PATCH)|--data|-d\s)'
  # Un segment est auto-autorisé seulement s'il correspond à un de ces motifs
  allow:
    - '^(ls|pwd|cat|head|tail|wc|grep|rg|find|tree|file|stat|du|df|echo|which|date|whoami|sort|uniq|cut|diff|jq|yq)\b'
    - '^git\s+(status|log|diff|show|branch|fetch|pull|add|commit|checkout|switch|stash|remote\s+-v)\b'
    - '^git\s+(rev-parse|ls-files|ls-tree|blame|describe|shortlog|reflog|show-ref|grep|restore|merge|cherry-pick|mv|tag\s+-l|worktree\s+list|config\s+--get|remote(\s+show)?\s*$)'
    # Lecture et utilitaires de texte (sed seulement sans -i, c'est-à-dire sans modifier de fichier)
    - '^sed\b(?!.*\s-[a-zA-Z]*i)'
    - '^(awk|gawk|tr|nl|column|fold|fmt|paste|join|comm|tac|rev|less|more|basename|dirname|realpath|readlink|printf|true|false|test|seq|sleep|xxd|od|hexdump|md5sum|sha1sum|sha256sum|base64|iconv|ps|free|uptime|nproc|id|hostname|uname|locale|type)\b'
    - '^tar\s+-?(?![a-zA-Z]*x)[a-zA-Z]*t[a-zA-Z]*\s'   # lister une archive (jamais -x : extraction)
    - '^(unzip\s+-l|zcat|gzip\s+-[dlc]|gunzip\s+-c|zgrep)\b'
    # Outils de développement qui restent dans le pod (comme python, déjà autorisé)
    - '^(R|Rscript|julia|quarto|ipython|make|cmake|gcc|g\+\+|javac|java|mvn|gradle|tsc|eslint|prettier|vitest|jest|flake8|pylint|isort|coverage|tox|nox)\b'
    - '^jupyter\s+(nbconvert|execute|kernelspec\s+list)\b'
    - '^(go\s+(build|test|run|vet|fmt)|cargo\s+(build|test|run|check|fmt|clippy)|(pnpm|yarn|bun)\s+(test|run|lint|build))\b'
    - '^pre-commit\s+run\b'
    - '^(pip|uv\s+pip)\s+(list|show|freeze|check)\b'
    - '^uv\s+(sync|lock|tree|venv)\b'   # dépendances déclarées par le projet lui-même
    # GitHub en lecture seule (gh api sans méthode d'écriture ni champ envoyé)
    - '^gh\s+(repo\s+(view|list|clone)|pr\s+(view|list|diff|checks|status)|issue\s+(view|list)|run\s+(view|list|watch)|search)\b'
    - '^gh\s+api\b(?!.*(-X|--method)\s*(POST|PUT|PATCH|DELETE))(?!.*\s(-f|-F|--field|--raw-field|--input)\s)'
    # Push d'une branche de travail : « git push [-u] origin <branche> », sans main/master/HEAD, sans
    # refspec (« a:main »), sans option (--force, --all, --tags, --delete…) => validation sinon.
    - '^git\s+push(\s+(-u|--set-upstream))?\s+origin\s+(?!(refs/heads/)?(main|master|HEAD)\s*$)[\w.][\w./-]*\s*$'
    - '^(python3?|uv\s+run|pytest|ruff|black|mypy|node|npm\s+(test|run))\b'
    - '^kubectl\s+(get|describe|logs|top|explain|config\s+(view|current-context)|auth\s+can-i)\b'
    - '^helm\s+(list|ls|status|get|history|show|search|template|lint)\b'
    - '^(mc\s+(ls|cat|stat)|aws\s+s3\s+ls)\b'
    - '^(mkdir|touch|cd)\b'

# Validations automatiques (« default: true » : dans toutes les conversations ; « false » : toutes demandées).
# Grande liberté par défaut : Claude installe, supprime dans ~/work, pousse (main compris), déploie avec helm ou kubectl
# apply, utilise sudo, S3 en lecture et écriture… sans attendre. Chaque auto-approbation est journalisée (policy: trust)
# et signalée sur la carte de la tâche.
# Restent demandés seulement ce qui détruit sans retour : les refus (deny), « paths_never », les écritures hors de
# ~/work et /tmp, l'arrêt d'un service (son stockage est perdu), un dépôt GitHub public, et « never ».
# Le mode hard (téléphone) lève aussi ces validations, sauf les refus.
trust:
  default: true
  tools: [NotebookEdit, WebFetch, mcp__services__lancer_service, mcp__cockpit__creer_depot, mcp__cockpit__lancer_en_parallele]
  scratch_paths: ['^/tmp/', '^/home/onyxia/work/']   # hors du projet : fichiers temporaires et espace de travail du pod
  paths_never: ['/\.git/', '/policy\.(ya?ml|py)$']   # historique git (le modifier à la main le corrompt) ; la politique elle-même
  unknown_commands: true   # commandes non répertoriées (make, docker build, scripts du projet…)
  opaque: true             # substitutions et redirections, contrôlées par « never » sur la commande entière
  bash:
    - '.'   # toute commande soumise à validation, sauf « never » ci-dessous
  never:
    - '\bhelm\s+(uninstall|delete)'                         # supprime un service et son stockage
    - '\bkubectl\s+(delete|drain|cordon)'
    - '\bgit\s+push\b.*(--force|--delete|--mirror|--prune|\s-\w*[fd]\b|\s\+|:)'  # réécrit ou efface l'historique distant
    - '\b(mc|aws\s+s3|s3cmd|rclone)\b.*\b(rm|rb|del|delete|purge)\b'   # efface des données S3
    - '\baws\s+s3api\s+delete|\bmc\s+mirror\b.*--remove'
    - 'policy\.(ya?ml|py)\b'   # la politique elle-même : un agent ne la modifie jamais sans toi (lecture : autorisée)
    - '\bvault\b'                                            # secrets : jamais lus ni écrits sans toi
